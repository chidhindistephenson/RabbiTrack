openapi: 3.1.0
info:
  title: RabbiTrack API
  version: 0.1.0
  description: Starter contract for the versioned RabbiTrack REST API.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: API health check
      operationId: getHealth
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - app
                properties:
                  status:
                    type: string
                    example: ok
                  app:
                    type: string
                    example: RabbiTrack

