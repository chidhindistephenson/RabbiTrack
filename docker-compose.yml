services:
  postgres:
    image: postgres:17-alpine
    container_name: rabbitrack-postgres
    environment:
      POSTGRES_DB: rabbitrack
      POSTGRES_USER: rabbitrack
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbitrack -d rabbitrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: rabbitrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: rabbitrack-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  redis-data:
